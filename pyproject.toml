[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "lris2"
version = "0.1.0"
description = "LRIS2 Instrument Control Software"
requires-python = ">=3.12"
authors = [
    {name = "Michael Langmayr", email = "langmayr@caltech.edu"}
]
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "instrumentctl@git+https://github.com/CaltechOpticalObservatories/instrumentctl.git",
    "libby@git+https://github.com/CaltechOpticalObservatories/libby.git",
    "pyyaml",
]

[project.scripts]
lris2 = "lris2.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
]
# The camera daemon only, on the host that runs it: install.sh --extra camera.
# The camera_interface module it drives is built from lris2-camerad-instrument
camera = [
    "pycamerad@git+https://github.com/COO-Utilities/pycamerad.git",
    "camera-daemon@git+https://github.com/COO-Utilities/camera-daemon.git",
    "lris2-camera-interface@git+https://github.com/CaltechOpticalObservatories/lris2-camerad-instrument",
]
[tool.setuptools.package-dir]
lris2 = "src"

[tool.setuptools]
packages = ["lris2", "lris2.cli", "lris2.driver"]

[tool.setuptools.package-data]
"lris2.cli" = ["instrument.toml"]

# The vendor drivers are vendored as submodules so they can be fixed in place,
# but their own dependencies still have to reach the environment.
# coo_ethercat does not build as a package yet, and lris2_csu depends on it
[tool.uv.workspace]
members = [
    "src/driver/inficon",
    "src/driver/pdu",
    "src/driver/sunpower",
]

[tool.uv]
# The drivers pin this to v1.0.0 and v1.0.1, and uv allows one URL per package
override-dependencies = [
    "hardware_device_base @ git+https://github.com/COO-Utilities/hardware_device_base@v1.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["gui"]
