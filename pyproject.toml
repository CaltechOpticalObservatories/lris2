[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "lris2"
version = "0.1.0"
description = "LRIS2 Instrument Control Software"
requires-python = ">=3.12"
authors = [
    {name = "Michael Langmayr", email = "langmayr@caltech.edu"}
]
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "instrumentctl@git+https://github.com/CaltechOpticalObservatories/instrumentctl.git",
    "pyserial",
    "pyyaml",
]

[project.scripts]
lris2 = "lris2.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
]
# The camera daemon only; the others need none of this. The camera_interface
# module it drives is built per instrument, from lris2-camerad-instrument
camera = [
    "pycamerad@git+https://github.com/COO-Utilities/pycamerad.git",
    "camera-daemon@git+https://github.com/COO-Utilities/camera-daemon.git",
]

[tool.setuptools.package-dir]
lris2 = "src"

[tool.setuptools]
packages = ["lris2", "lris2.cli", "lris2.driver"]

[tool.setuptools.package-data]
"lris2.cli" = ["instrument.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["gui"]
