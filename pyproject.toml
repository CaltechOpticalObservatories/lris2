[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "lris2"
version = "0.1.0"
description = "LRIS2 Instrument Control Software"
requires-python = ">=3.12"
authors = [
    {name = "Michael Langmayr", email = "langmayr@caltech.edu"}
]
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    # dashboard extra: lris2-dashboard.service
    "instrumentctl[dashboard]@git+https://github.com/CaltechOpticalObservatories/instrumentctl.git",
    # influxdb extra: the keygrabber's InfluxDB sink; otel: traces, metrics and
    # the keygrabber's Prometheus sink, exported when /etc/lris2/otel.env is set
    "libby[influxdb,otel]@git+https://github.com/CaltechOpticalObservatories/libby.git",
    "pyyaml",
]

[project.scripts]
lris2 = "lris2.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
]
# The CSU daemon, on the host that reaches the CSU PLC: install.sh --extra csu
csu = [
    "cooethercat[twincat]@git+https://github.com/CaltechOpticalObservatories/coo-ethercat.git",
    "lris2csu",
]
# The camera daemon only, on the host that runs it: install.sh --extra camera.
# The camera_interface module it drives is built from lris2-camerad-instrument
camera = [
    "pycamerad@git+https://github.com/COO-Utilities/pycamerad.git",
    "camera-daemon@git+https://github.com/COO-Utilities/camera-daemon.git",
    "lris2-camera-interface@git+https://github.com/CaltechOpticalObservatories/lris2-camerad-instrument",
]
# The Galil driver's Python bindings, on a host with Galil's gclib package
# installed: install.sh --extra galil
galil = [
    "gclib",
]
[tool.setuptools.package-dir]
lris2 = "src"

[tool.setuptools]
packages = ["lris2", "lris2.cli", "lris2.driver"]

[tool.setuptools.package-data]
"lris2.cli" = ["instrument.toml"]

# The vendor drivers are vendored as submodules so they can be fixed in place,
# but their own dependencies still have to reach the environment.
# coo_ethercat and lris2_csu come in through the csu extra instead
[tool.uv.workspace]
members = [
    "src/driver/galil",
    "src/driver/inficon",
    "src/driver/pdu",
    "src/driver/sunpower",
]

[tool.uv]
# The drivers pin this to v1.0.0 and v1.0.1, and uv allows one URL per package
override-dependencies = [
    "hardware_device_base @ git+https://github.com/COO-Utilities/hardware_device_base@v1.0.1",
]

[tool.uv.sources]
gclib = { index = "galil" }
# The CSU's slit and bar pair model, from the submodule
lris2csu = { path = "src/driver/lris2_csu", editable = true }

[[tool.uv.index]]
name = "galil"
url = "https://www.galil.com/sw/pub/python"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["gui"]
