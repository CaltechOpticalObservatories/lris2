#
# Usage:
#   daemons/csu/csu -c config/csu/csu.yaml
#
# The CSU bars behind the CX-LAB01 PLC motion server. Bar CSU-N sits in PLC slot
# N+1, which is linked to NC axis N+1 and EPOS4 drive N+1 (station 1001+N).

peer_id: csu
group_id: lris2

hardware:
  sim: false   # true serves simulated bars, no PLC
  # twincat: the PLC is the EtherCAT master. pysoem: this host is, on enp3s0;
  # move the drive chain's EtherCAT cable from the PLC to enp3s0 first
  master: twincat

topology:
  name: csu
  defaults:
    # 10000 encoder increments per mm on every bar, as the NC axes scale them
    units: {name: mm, increments_per_unit: 10000}
    limits: {velocity: 5.0}
  axes:
    - {name: CSU-0, plc_index: 1, station_address: 1001, slave_index: 0}
    - {name: CSU-1, plc_index: 2, station_address: 1002, slave_index: 1}
    - {name: CSU-2, plc_index: 3, station_address: 1003, slave_index: 2}
    - {name: CSU-3, plc_index: 4, station_address: 1004, slave_index: 3}
    - {name: CSU-4, plc_index: 5, station_address: 1005, slave_index: 4}
    - {name: CSU-5, plc_index: 6, station_address: 1006, slave_index: 5}
    - {name: CSU-6, plc_index: 7, station_address: 1007, slave_index: 6}
    - {name: CSU-7, plc_index: 8, station_address: 1008, slave_index: 7}
    - {name: CSU-8, plc_index: 9, station_address: 1009, slave_index: 8}
    - {name: CSU-9, plc_index: 10, station_address: 1010, slave_index: 9}
    - {name: CSU-10, plc_index: 11, station_address: 1011, slave_index: 10}
    - {name: CSU-11, plc_index: 12, station_address: 1012, slave_index: 11}
    - {name: CSU-12, plc_index: 13, station_address: 1013, slave_index: 12}
    - {name: CSU-13, plc_index: 14, station_address: 1014, slave_index: 13}
    - {name: CSU-14, plc_index: 15, station_address: 1015, slave_index: 14}
    - {name: CSU-15, plc_index: 16, station_address: 1016, slave_index: 15}
    - {name: CSU-16, plc_index: 17, station_address: 1017, slave_index: 16}
    - {name: CSU-17, plc_index: 18, station_address: 1018, slave_index: 17}
    - {name: CSU-18, plc_index: 19, station_address: 1019, slave_index: 18}
    - {name: CSU-19, plc_index: 20, station_address: 1020, slave_index: 19}
    - {name: CSU-20, plc_index: 21, station_address: 1021, slave_index: 20}
    - {name: CSU-21, plc_index: 22, station_address: 1022, slave_index: 21}
    - {name: CSU-22, plc_index: 23, station_address: 1023, slave_index: 22}

# Where each bar sits: side of the slit, row from the top (1-12), and which way
# a positive move takes it as seen from the webcam. The left and right bar of a
# row form a slit's bar pair; a row with one bar placed still forms a slit, open
# to the far side. Bars not listed are not in service.
placement:
  rows: 12
  bars:
    CSU-0:  {side: left,  row: 7,  plus: left}
    CSU-1:  {side: left,  row: 8,  plus: left}
    CSU-2:  {side: left,  row: 9,  plus: left}
    CSU-3:  {side: left,  row: 10, plus: left}
    CSU-4:  {side: left,  row: 11, plus: left}
    CSU-5:  {side: left,  row: 12, plus: left}
    CSU-6:  {side: left,  row: 5,  plus: right}
    CSU-7:  {side: left,  row: 4,  plus: right}
    CSU-8:  {side: left,  row: 3,  plus: right}
    CSU-9:  {side: left,  row: 2,  plus: right}
    CSU-10: {side: left,  row: 1,  plus: right}
    CSU-13: {side: right, row: 9,  plus: left}
    CSU-14: {side: right, row: 10, plus: left}
    CSU-15: {side: right, row: 11, plus: left}
    CSU-16: {side: right, row: 12, plus: left}
    CSU-18: {side: right, row: 5,  plus: right}

# The transport for each master; hardware.master picks one
transports:
  twincat:
    host: 192.168.30.99
    ams_net_id: 5.57.12.96.1.1
    ams_port: 851
    master_net_id: 5.57.12.96.4.1
    # This host's AMS net id; the PLC needs a static route back to it
    local_net_id: 192.168.30.1.1.1
  pysoem:
    # A dedicated NIC, cabled straight to the first drive with no switch
    ifname: enp3s0

logging:
  level: INFO
