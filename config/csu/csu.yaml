#
# Usage:
#   daemons/csu -c config/csu/csu.yaml
#
# The CSU bars behind the CX-LAB01 PLC motion server. Bar CSU-N sits in PLC slot
# N+1, which is linked to NC axis N+1 and EPOS4 drive N+1 (station 1001+N).

peer_id: csu
group_id: lris2

hardware:
  sim: false   # true serves simulated bars, no PLC

topology:
  name: csu
  backend: twincat
  transport:
    host: 192.168.30.99
    ams_net_id: 5.57.12.96.1.1
    ams_port: 851
    master_net_id: 5.57.12.96.4.1
    # This host's AMS net id; the PLC needs a static route back to it
    local_net_id: 192.168.30.1.1.1
  defaults:
    units: {name: mm}
    limits: {velocity: 5.0}
  axes:
    - {name: CSU-0, plc_index: 1, station_address: 1001}
    - {name: CSU-1, plc_index: 2, station_address: 1002}
    - {name: CSU-2, plc_index: 3, station_address: 1003}
    - {name: CSU-3, plc_index: 4, station_address: 1004}
    - {name: CSU-4, plc_index: 5, station_address: 1005}
    - {name: CSU-5, plc_index: 6, station_address: 1006}
    - {name: CSU-6, plc_index: 7, station_address: 1007}
    - {name: CSU-7, plc_index: 8, station_address: 1008}
    - {name: CSU-8, plc_index: 9, station_address: 1009}
    - {name: CSU-9, plc_index: 10, station_address: 1010}
    - {name: CSU-10, plc_index: 11, station_address: 1011}
    - {name: CSU-11, plc_index: 12, station_address: 1012}
    - {name: CSU-12, plc_index: 13, station_address: 1013}
    - {name: CSU-13, plc_index: 14, station_address: 1014}
    - {name: CSU-14, plc_index: 15, station_address: 1015}
    - {name: CSU-15, plc_index: 16, station_address: 1016}
    - {name: CSU-16, plc_index: 17, station_address: 1017}
    - {name: CSU-17, plc_index: 18, station_address: 1018}
    - {name: CSU-18, plc_index: 19, station_address: 1019}
    - {name: CSU-19, plc_index: 20, station_address: 1020}
    - {name: CSU-20, plc_index: 21, station_address: 1021}
    - {name: CSU-21, plc_index: 22, station_address: 1022}
    - {name: CSU-22, plc_index: 23, station_address: 1023}

logging:
  level: INFO
