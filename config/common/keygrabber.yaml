# Keyword archiver: polls the LRIS2 daemons and writes to InfluxDB for Grafana
#
# Usage:
#   daemons/keygrabber -c config/common/keygrabber.yaml
#
# The InfluxDB token comes from the environment variable named in token_env.

peer_id: keygrabber
group_id: lris2

sink:
  type: influxdb
  url: http://meridian.caltech.edu:8086
  org: caltech
  bucket: LRIS2
  token_env: LRIS2_INFLUX_TOKEN

# Reads run concurrently across peers; a single daemon still answers one at a time
workers: 4

defaults:
  interval_s: 30.0
  timeout_s: 2.0
  refresh_s: 300.0

# "%" takes everything readable except uptime and lasterror, which libby excludes
collections:

  # Pressure moves fast during a pumpdown; the cooler trend is slow
  rpress:
    peer: lris2.rpress
    keywords: ["%"]
    interval_s: 10.0
  rcryo:
    peer: lris2.rcryo
    keywords: ["%"]
    interval_s: 60.0

  # Everything: HeaterX, every bias channel, camera state. A full read takes
  # about 1.5 s, and setpoints and enables only answer with firmware loaded
  rcam:
    peer: lris2.rcam
    keywords: ["%"]
    timeout_s: 5.0

  # One telnet query per keyword, so a batch of 32 takes a couple of seconds
  pdu1:
    peer: l2power.pdu1
    keywords: ["state%", "current%", "power%", "energy%"]
    timeout_s: 10.0

logging:
  level: INFO
