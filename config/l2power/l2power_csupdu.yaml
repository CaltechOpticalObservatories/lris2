# l2power csupdu - Eaton EMAT-08 (epduC5) in the CSU lab
#
# Usage:
#   daemons/l2power/eaton_pdu -c config/l2power/l2power_csupdu.yaml
#
# Addressed as l2power.csupdu, e.g.
#   libby show l2power.csupdu.power_ethercat

peer_id: csupdu
group_id: l2power

hardware:
  # Lease pinned by the dnsmasq dhcp-host entry for its MAC on lris2-ethercat
  ip_address: 192.168.30.200
  tcp_port: 23
  outlet_count: 8
  outlet_names:
    1: windows
    2: lantronix
    4: ethercat
    5: plc
    7: gateway
  # Telnet login from /etc/lris2/secrets.env; the password is the PDU's serial number
  username_env: LRIS2_PDU_USERNAME
  password_env: LRIS2_CSUPDU_PASSWORD

logging:
  level: INFO
